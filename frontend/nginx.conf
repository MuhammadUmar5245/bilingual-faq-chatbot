server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Demo college website embedding the widget (FR-08)
    location = / { try_files /index.html =404; }

    # Embeddable widget - may be loaded by any college website
    location = /widget.js {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300";
        try_files /widget.js =404;
    }

    # Admin single-page app
    location /admin/ { try_files $uri $uri/ /admin/index.html; }

    # REST API -> Flask/gunicorn container
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
